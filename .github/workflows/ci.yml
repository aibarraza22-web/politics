name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest -q

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"

      - name: Install dependencies
        run: uv sync

      - name: Render paper (PDF + HTML)
        run: make paper

      - name: Upload rendered paper
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: |
            paper/_output/paper.pdf
            paper/_output/paper.html
