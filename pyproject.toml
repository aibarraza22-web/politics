[project]
name = "curtailment-to-compute"
version = "0.1.0"
description = "Estimated Arizona solar curtailment + flexible-compute simulation (research codebase and working paper)"
readme = "README.md"
# Spec targets 3.12; 3.11 is the floor so the pinned lockfile also resolves there.
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.4",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "polars>=1.42.1",
    "pvlib>=0.15.2",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "s3fs>=2026.6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter-client>=8.9.1",
    "jupyter-core>=5.9.1",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "playwright>=1.61.0",
    "pypdf>=6.14.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.20",
    "tabulate>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
# E402: figure scripts set the matplotlib backend before importing pyplot.
ignore = ["E402"]
